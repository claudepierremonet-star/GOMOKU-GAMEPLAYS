<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Obsidian/Charcoal) -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2D35" />
      <stop offset="40%" stop-color="#16171B" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    
    <!-- Outer Golden Bevel -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DF8E" />
      <stop offset="25%" stop-color="#C29B4A" />
      <stop offset="50%" stop-color="#6E5124" />
      <stop offset="75%" stop-color="#C29B4A" />
      <stop offset="100%" stop-color="#F2DF8E" />
    </linearGradient>

    <!-- Grid Gold -->
    <linearGradient id="gridGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <!-- White Stone Gradients (Pearl/Ivory) -->
    <radialGradient id="whiteStoneBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3F4F6" />
      <stop offset="75%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </radialGradient>
    <radialGradient id="whiteStoneHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Black Stone Gradients (Obsidian) -->
    <radialGradient id="blackStoneBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="30%" stop-color="#1F2937" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="blackStoneHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#9CA3AF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0" />
    </radialGradient>

    <!-- Stone Drop Shadows -->
    <filter id="stoneShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-opacity="0.65" flood-color="#000" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.8" flood-color="#000" />
    </filter>
  </defs>

  <!-- Base App Icon Shape -->
  <rect width="512" height="512" fill="url(#bgGlow)" rx="115" ry="115" />
  
  <!-- Outer Gold Frame -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="url(#goldBevel)" stroke-width="10" rx="113" ry="113" opacity="0.8" />
  <rect x="14" y="14" width="484" height="484" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="103" ry="103" />

  <!-- Circular Motif (Luxury watch face vibe) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldBevel)" stroke-width="2" opacity="0.15" stroke-dasharray="1 10" stroke-linecap="round" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldBevel)" stroke-width="1" opacity="0.1" />

  <!-- The Grid (3x3 pattern centered) -->
  <g stroke="url(#gridGold)" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal lines -->
    <line x1="86" y1="140" x2="426" y2="140" stroke-width="4" />
    <line x1="86" y1="256" x2="426" y2="256" stroke-width="4" />
    <line x1="86" y1="372" x2="426" y2="372" stroke-width="4" />
    
    <!-- Vertical lines -->
    <line x1="140" y1="86" x2="140" y2="426" stroke-width="4" />
    <line x1="256" y1="86" x2="256" y2="426" stroke-width="4" />
    <line x1="372" y1="86" x2="372" y2="426" stroke-width="4" />
  </g>

  <!-- Intersection Markers -->
  <g fill="url(#gridGold)" opacity="0.8">
    <circle cx="256" cy="256" r="5" />
    <circle cx="140" cy="140" r="4" />
    <circle cx="372" cy="140" r="4" />
    <circle cx="140" cy="372" r="4" />
    <circle cx="372" cy="372" r="4" />
  </g>

  <!-- Stones - Positioned at Intersections -->
  
  <!-- Right: White -->
  <g filter="url(#stoneShadow)">
    <circle cx="372" cy="256" r="46" fill="url(#whiteStoneBase)" />
    <circle cx="372" cy="256" r="46" fill="url(#whiteStoneHighlight)" />
  </g>

  <!-- Top-Mid: White -->
  <g filter="url(#stoneShadow)">
    <circle cx="256" cy="140" r="46" fill="url(#whiteStoneBase)" />
    <circle cx="256" cy="140" r="46" fill="url(#whiteStoneHighlight)" />
  </g>

  <!-- Bottom-Left: Black -->
  <g filter="url(#stoneShadow)">
    <circle cx="140" cy="372" r="46" fill="url(#blackStoneBase)" />
    <circle cx="140" cy="372" r="46" fill="url(#blackStoneHighlight)" />
  </g>

  <!-- Left: Black -->
  <g filter="url(#stoneShadow)">
    <circle cx="140" cy="256" r="46" fill="url(#blackStoneBase)" />
    <circle cx="140" cy="256" r="46" fill="url(#blackStoneHighlight)" />
  </g>

  <!-- Center: Black (Slightly larger, winning move or prominent piece) -->
  <g filter="url(#stoneShadow)">
    <circle cx="256" cy="256" r="54" fill="url(#blackStoneBase)" />
    <circle cx="256" cy="256" r="54" fill="url(#blackStoneHighlight)" />
  </g>

</svg>
