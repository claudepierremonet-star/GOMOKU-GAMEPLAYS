<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A00" />
    </linearGradient>
    <linearGradient id="whiteStone" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#bdbdbd" />
    </linearGradient>
    <linearGradient id="blackStone" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="40%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="112" ry="112" />

  <!-- Board Grid -->
  <g stroke="url(#gold)" stroke-width="6" opacity="0.8" filter="url(#glow)">
    <line x1="128" y1="128" x2="384" y2="128" />
    <line x1="128" y1="256" x2="384" y2="256" />
    <line x1="128" y1="384" x2="384" y2="384" />
    
    <line x1="128" y1="128" x2="128" y2="384" />
    <line x1="256" y1="128" x2="256" y2="384" />
    <line x1="384" y1="128" x2="384" y2="384" />
  </g>

  <!-- Center Dot -->
  <circle cx="256" cy="256" r="8" fill="url(#gold)" />

  <!-- Stones -->
  <circle cx="192" cy="192" r="44" fill="url(#blackStone)" filter="url(#shadow)" />
  <circle cx="320" cy="192" r="44" fill="url(#whiteStone)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="44" fill="url(#blackStone)" filter="url(#shadow)" />
  <circle cx="192" cy="320" r="44" fill="url(#whiteStone)" filter="url(#shadow)" />
  <circle cx="320" cy="320" r="44" fill="url(#blackStone)" filter="url(#shadow)" />

  <!-- Text -->
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="4">GOMOKU</text>
</svg>
