<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad)" />
  
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round">
    <!-- Horizontal -->
    <line x1="128" y1="128" x2="384" y2="128"/>
    <line x1="128" y1="192" x2="384" y2="192"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
    <line x1="128" y1="320" x2="384" y2="320"/>
    <line x1="128" y1="384" x2="384" y2="384"/>
    
    <!-- Vertical -->
    <line x1="128" y1="128" x2="128" y2="384"/>
    <line x1="192" y1="128" x2="192" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="320" y1="128" x2="320" y2="384"/>
    <line x1="384" y1="128" x2="384" y2="384"/>
  </g>
  
  <!-- Stones -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="192" cy="192" r="28" fill="#111827" filter="url(#shadow)" />
  <circle cx="192" cy="256" r="28" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="256" cy="192" r="28" fill="#111827" filter="url(#shadow)" />
  <circle cx="320" cy="320" r="28" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="320" cy="256" r="28" fill="#111827" filter="url(#shadow)" />

  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="8">GOMOKU</text>
</svg>
